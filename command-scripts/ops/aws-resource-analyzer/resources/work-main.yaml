# $PLAB_REPO_SERVER — AWS Resource Analyzer Configuration
# Updated: 2026-02-24
#
# 이 파일은 /ops:aws-resource-analyzer 커맨드가 참조하는 리소스 설정입니다.
# 리소스가 변경되면 이 파일을 업데이트하세요.

#
# 주의: project / path_match 값의 $PLAB_* 는 환경변수다. YAML은 스스로 확장하지
# 않으므로, 이 파일을 읽는 쪽에서 반드시 확장한 뒤 pwd와 비교할 것.
# 확장하지 않으면 리터럴 문자열과 비교하게 되어 매칭이 항상 실패한다.
#   pm=$(grep '^path_match:' work-main.yaml | cut -d'"' -f2)
#   eval "pm=\"$pm\""   # 대입 문맥. eval echo 는 zsh가 glob으로 해석해 실패한다.
project: $PLAB_REPO_SERVER
path_match: "*/$PLAB_REPO_SERVER*"
aws_profile: default
region: ap-northeast-2

resources:
  - type: elasticbeanstalk
    name: "웹 서버 환경"
    application: prod
    environment: Prod-env-1

  - type: rds
    name: "메인 DB (Primary)"
    instance_id: plab3
    role: primary

  - type: rds
    name: "메인 DB (Replica)"
    instance_id: plab3-replica
    role: replica

  - type: elasticache
    name: "Redis Primary"
    cluster_id: pf-production-redis-001
    role: primary

  - type: elasticache
    name: "Redis Replica 1"
    cluster_id: pf-production-redis-002
    role: replica

  - type: elasticache
    name: "Redis Replica 2"
    cluster_id: pf-production-redis-003
    role: replica
