# pf-server-django — AWS Resource Analyzer Configuration
# Updated: 2026-02-24
#
# 이 파일은 /ops:aws-resource-analyzer 커맨드가 참조하는 리소스 설정입니다.
# 리소스가 변경되면 이 파일을 업데이트하세요.

project: pf-server-django
path_match: "*/pf-server-django*"
aws_profile: default
region: ap-northeast-2

resources:
  - type: elasticbeanstalk
    name: "웹 서버 환경"
    application: prod
    environment: Prod-env-1

  - type: rds
    name: "메인 DB (Primary)"
    instance_id: plab3
    role: primary

  - type: rds
    name: "메인 DB (Replica)"
    instance_id: plab3-replica
    role: replica

  - type: elasticache
    name: "Redis Primary"
    cluster_id: pf-production-redis-001
    role: primary

  - type: elasticache
    name: "Redis Replica 1"
    cluster_id: pf-production-redis-002
    role: replica

  - type: elasticache
    name: "Redis Replica 2"
    cluster_id: pf-production-redis-003
    role: replica
